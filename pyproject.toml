[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rerankgate"
version = "0.4.0"
description = "Agentic RAG quality gate: hybrid retrieval with a sufficiency gate, query-rewrite retries, and per-stage metrics. Local-first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
keywords = ["rag", "retrieval", "rerank", "bm25", "quality-gate", "agentic"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

[project.optional-dependencies]
local = ["numpy>=1.24", "sentence-transformers>=2.2"]
dev = ["pytest>=7", "ruff>=0.1", "build", "twine", "mypy"]

[project.scripts]
rerankgate = "rerankgate.cli:main"

[project.urls]
Homepage = "https://calasautomations.com"
Repository = "https://github.com/calasdan-sketch/rerankgate"
Issues = "https://github.com/calasdan-sketch/rerankgate/issues"
Changelog = "https://github.com/calasdan-sketch/rerankgate/blob/HEAD/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rerankgate = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
